<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-white">
          <path fill-rule="evenodd" d="M7.5 6v.75H5.513c-.96 0-1.764.724-1.865 1.679l-1.263 12A1.875 1.875 0 004.25 22.5h15.5a1.875 1.875 0 001.865-2.071l-1.263-12a1.875 1.875 0 00-1.865-1.679H16.5V6a4.5 4.5 0 10-9 0zM12 3a3 3 0 00-3 3v.75h6V6a3 3 0 00-3-3zm-3 8.25a3 3 0 106 0v-.75a.75.75 0 011.5 0v.75a4.5 4.5 0 11-9 0v-.75a.75.75 0 011.5 0v.75z" clip-rule="evenodd" />
        </svg>
      </div>
      <h1>Crear Cuenta</h1>
      <p>Únete a la plataforma E-Commerce Educativa</p>
    </div>

    <form (ngSubmit)="registrar()">
      <div class="form-group">
        <label>Nombre Completo</label>
        <input 
          type="text" 
          name="nombre" 
          [(ngModel)]="usuario.nombre" 
          required>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="usuario.email" 
          required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input 
          type="password" 
          name="password" 
          [(ngModel)]="usuario.password" 
          required>
      </div>

      <button type="submit" class="btn-submit" [disabled]="cargando">
        {{ cargando ? 'Creando cuenta...' : 'Registrarse' }}
        
        @if (!cargando) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        }
      </button>
    </form>

    <div class="register-prompt">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a>
    </div>
  </div>
</div>

<!-- Toast de Notificación -->
@if (toastMensaje) {
  <div class="toast-notification">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    {{ toastMensaje }}
  </div>

  <!-- Toast de Notificación Dinámico -->
@if (toastMensaje) {
  <div class="toast-notification" [class.toast-error]="toastTipo === 'error'">
    
    @if (toastTipo === 'success') {
      <!-- Icono de Éxito (Check) -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    } @else {
      <!-- Icono de Error (Advertencia) -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    }
    
    {{ toastMensaje }}
  </div>
}
}
